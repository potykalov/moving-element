name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      HUSKY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Corepack
        run: |
          npm uninstall -g yarn
          npm install -g corepack
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: |
          if [ -z "$(yarn jest --listTests)" ]; then
            echo "No tests found — skipping coverage."
          else
            yarn coverage
          fi

      - name: Run ESLint
        run: yarn lint

      - name: Run build production
        run: yarn prod
